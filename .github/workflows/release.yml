name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Determine next version from conventional commits
        id: bump
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "no previous tag; releasing v0.1.0"
            echo "new_tag=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LOG=$(git log --format=%B "$PREV"..HEAD)
          BUMP=none
          if printf '%s' "$LOG" | grep -qE 'BREAKING CHANGE|!:'; then
            BUMP=major
          elif printf '%s' "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP=minor
          elif printf '%s' "$LOG" | grep -qE '^fix(\([^)]*\))?:'; then
            BUMP=patch
          fi
          if [ "$BUMP" = "none" ]; then
            echo "no releasable commits since $PREV"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${PREV#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "new_tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Tag and create GitHub release
        if: steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$NEW_TAG" > VERSION
          git add VERSION
          git commit -m "build: bump VERSION to $NEW_TAG [skip ci]"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin main
          git push origin "$NEW_TAG"
          gh release create "$NEW_TAG" --generate-notes --verify-tag

      - name: Confirm proxy has indexed the version
        if: steps.bump.outputs.skip == 'false'
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://proxy.golang.org/github.com/umutondersu/gwt/@v/${NEW_TAG}.info" >/dev/null; then
              echo "proxy.golang.org has indexed ${NEW_TAG}"
              exit 0
            fi
            sleep 10
          done
          echo "proxy.golang.org did not index ${NEW_TAG} within 5 minutes" >&2
          exit 1